name: cs3sp-incident

services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-incident_reporting}
      DB_USERNAME: ${DB_USERNAME:-incident_app}
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/start.ps1 to create local settings}
    volumes:
      - ./public:/var/www/app/public:ro
      - ./src:/var/www/app/src:ro
      - ./scripts:/var/www/app/scripts:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/var/www/app/scripts/check-setup.php"]
      interval: 10s
      timeout: 5s
      retries: 6

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-incident_reporting}
      MYSQL_USER: ${DB_USERNAME:-incident_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/start.ps1 to create local settings}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/start.ps1 to create local settings}
    volumes:
      - incident_database:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --batch --skip-column-names --execute="SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  incident_database:
